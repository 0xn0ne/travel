[project]
name = "shi-tu"
version = "0.1.0"
description = "拾途 — Taste-based travel itinerary generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "pydantic==2.13.1",
    "pydantic-settings==2.13.1",
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "openai==2.31.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "tenacity==9.1.4",
    "email-validator>=2.1.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.7.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.10",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
